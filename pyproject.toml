[project]
name = "dorilar-istemol-bot"
version = "1.0.0"
description = "Telegram bot — retsept PDF dan dori jadvali va eslatmalar"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort — import tartibi
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

ignore = [
    # Loyiha matnlari o'zbek KIRILLchasida. RUF001-003 kirill 'о', 'а', 'е'
    # kabi harflarni lotin harflariga "o'xshash" deb har bir qatorda
    # xato beradi — bu yerda bu qoidalar mantiqsiz.
    "RUF001",
    "RUF002",
    "RUF003",
    # Qator uzunligi formatter ishi, lint uni bloklamasin
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Testlarda assert va uzun nomlar normal
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
